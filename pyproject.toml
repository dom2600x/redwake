[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redwake"
version = "0.1.0"
description = "Evidence-first API authorisation experiments"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
redwake = "redwake.cli:main"

[tool.setuptools.packages.find]
include = ["redwake*"]
